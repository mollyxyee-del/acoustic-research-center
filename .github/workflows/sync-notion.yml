name: Sync Notion content

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Pull library and about from Notion
        run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: 41bae2a3-d440-8088-8aa4-000b7bd3f460
          NOTION_ABOUT_DATA_SOURCE_ID: 41bae2a3-d440-80da-94da-000bf34672a7
          NOTION_RESEARCH_TYPES_DATA_SOURCE_ID: 420ae2a3-d440-8052-b43a-000b533c5819
          NOTION_SITE_TEXT_DATA_SOURCE_ID: 420ae2a3-d440-8000-ae00-000b6bd471a7

      - name: Commit updated JSON if changed
        run: |
          git add public/library.json public/about.json public/site-text.json
          if git diff --staged --quiet; then
            echo "No Notion changes to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "$(cat <<'EOF'
Update library and about content from Notion.

EOF
)"
          git push