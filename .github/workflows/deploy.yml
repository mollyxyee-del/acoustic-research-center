name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: 41bae2a3-d440-8088-8aa4-000b7bd3f460
          NOTION_ABOUT_DATA_SOURCE_ID: 41bae2a3-d440-80da-94da-000bf34672a7
          NOTION_RESEARCH_TYPES_DATA_SOURCE_ID: 420ae2a3-d440-8052-b43a-000b533c5819
          NOTION_SITE_TEXT_DATA_SOURCE_ID: 420ae2a3-d440-8000-ae00-000b6bd471a7
      - name: Publish built site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: acousticresearchcenter.org
          force_orphan: true